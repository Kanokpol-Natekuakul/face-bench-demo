<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Check-in (ทดสอบ)</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0 auto; padding: 16px; max-width: 520px; line-height: 1.5; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  section, form { border: 1px solid #8884; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  p { margin: 0 0 8px; }
  ul { margin: 0 0 12px; padding-left: 20px; }
  label { display: block; margin-bottom: 12px; }
  input[type=email], input[type=password] { display: block; width: 100%; min-height: 44px; margin-top: 4px; padding: 8px; box-sizing: border-box; font: inherit; font-size: 16px; }
  .check { display: flex; gap: 8px; align-items: flex-start; }
  .check input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; }
  button { min-height: 44px; padding: 8px 16px; border: 1px solid #8886; border-radius: 10px; background: none; color: inherit; font: inherit; cursor: pointer; }
  .primary { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .top { justify-content: space-between; margin-bottom: 14px; }
  .top span { min-width: 0; overflow-wrap: anywhere; }
  video { display: block; width: 100%; max-height: 60vh; margin-bottom: 10px; border-radius: 10px; background: #000; transform: scaleX(-1); }
  .msg { font-weight: 600; }
  .meta { font-size: 13px; opacity: .8; }
  .verdict { font-size: 22px; font-weight: 700; }
  .step { font-size: 28px; font-weight: 700; text-align: center; margin: 4px 0 10px; }
  .ok { color: #15803d; }
  .warn { color: #b45309; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 4px; border-bottom: 1px solid #8883; text-align: left; vertical-align: top; }
  th { white-space: nowrap; }
  .shot { display: block; width: 100%; max-width: 360px; margin: 0 0 8px; border-radius: 10px; }
  .thumb { display: block; width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
  @media (prefers-color-scheme: dark) {
    .ok { color: #4ade80; }
    .warn { color: #fbbf24; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
